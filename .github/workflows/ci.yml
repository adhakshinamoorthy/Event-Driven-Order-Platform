name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore EventDrivenOrderPlatform.slnx
      - run: dotnet format EventDrivenOrderPlatform.slnx --verify-no-changes --no-restore
      - run: dotnet build EventDrivenOrderPlatform.slnx -c Release --no-restore
      - run: dotnet test EventDrivenOrderPlatform.slnx -c Release --no-build --no-restore
      - run: dotnet list EventDrivenOrderPlatform.slnx package --vulnerable --include-transitive
      - run: docker compose --env-file .env.example config --quiet
